name: Windows

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [vulkan, cpu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jakoch/install-vulkan-sdk-action@v1.6.0
        if: matrix.backend == 'vulkan'
        with:
          vulkan_version: '1.4.341.0'
          install_runtime: true
      - name: Configure SPIR-V headers
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          foreach ($file in 'Include/vulkan/vulkan.h', 'Lib/vulkan-1.lib', 'Bin/glslc.exe') {
            if (!(Test-Path (Join-Path $env:VULKAN_SDK $file))) {
              throw "Missing Vulkan SDK component: $file"
            }
          }
          $source = Join-Path $env:RUNNER_TEMP spirv-headers
          $prefix = Join-Path $env:RUNNER_TEMP spirv-prefix
          git init $source
          git -C $source fetch --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git 6efe5ae6b7c6ad29da3f2cc3f164b9c3d72b78b1
          git -C $source checkout FETCH_HEAD
          cmake -S $source -B "$source/build" "-DCMAKE_INSTALL_PREFIX=$prefix"
          cmake --install "$source/build"
          "CMAKE_PREFIX_PATH=$prefix" >> $env:GITHUB_ENV
          $include = (Join-Path $prefix include).Replace('\', '/')
          "CXXFLAGS=/I`"$include`"" >> $env:GITHUB_ENV
      - run: cargo test --locked --all-targets
        if: matrix.backend == 'vulkan'
      - run: cargo test --locked --all-targets --no-default-features
        if: matrix.backend == 'cpu'
      - run: cargo build --locked
        if: matrix.backend == 'vulkan'
      - run: cargo build --locked --no-default-features
        if: matrix.backend == 'cpu'
